# WHICH HOST RUNS THE OPPORTUNITY SCAN — exactly one, ever.
#
# Read by scripts/alert-role.sh (sourced by scripts/alert-loop.sh and
# scripts/alert-keepalive.sh). The platform dev-server boot hook (vite.config.ts)
# and the page-open scan (src/server/scan-on-open.ts) read the same decision from
# src/lib/alert-role.ts, and test/alert-role.test.ts fails if the two disagree.
#
#   PRIMARY_SCANNER=vps        the owner's IONOS VPS scans (current: cut over 2026-11-08)
#   PRIMARY_SCANNER=platform   this platform computer scans (the old arrangement)
#
# To switch back in one command:  bash deploy/vps/rollback.sh
# It flips this line AND src/lib/alert-role.ts, stops the VPS units, and starts
# the platform worker. See deploy/vps/README.md ("Rollback").
PRIMARY_SCANNER=vps
